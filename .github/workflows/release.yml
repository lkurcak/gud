name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      crates-io: true
      targets: aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
      homebrew: true
      winget: true

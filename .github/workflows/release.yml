name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      id-token: write
      # rust-release's tag job starts the release on the tag it pushes; GitHub
      # won't start the workflow at all without this.
      actions: write
    secrets: inherit
    with:
      crates-io: true
      binaries: true
      homebrew: true
      winget: true
